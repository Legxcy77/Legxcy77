name: Update Profile Telemetry SVGs

on:
  schedule:
    - cron: "0 18 * * *" # Daily at 01:00 AM ICT (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_cards.py"
      - "fonts/**"

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Legxcy77
        run: python3 scripts/generate_cards.py

      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): refresh live GitHub telemetry SVGs"
            git push
          fi

